{% extends 'admin/base.html' %}

{% block title %}Logs{% endblock %}

{% block content %}
<style>
  body {
    background-color: #f8f9fa;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  h2 {
    text-align: center;
    color: #343a40;
    margin-bottom: 30px;
  }

  .table-wrapper {
    width: 95%;
    max-width: 1400px;
    margin: 0 auto;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  }

  thead {
    background-color: #007bff;
    color: white;
  }

  th, td {
    padding: 14px 20px;
    text-align: center;
    border-bottom: 1px solid #dee2e6;
  }

  tbody tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  tbody tr:hover {
    background-color: #e9f5ff;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  /* Payload cell 스타일 */
  td.payload {
    text-align: left;
    word-break: break-word;
    white-space: pre-wrap;
    max-width: 600px;
  }

  .block-btn {
    background-color: #dc3545;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
<br><br><br>
<h2>로그 기록</h2>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Timestamp</th>
        <th>IP Address</th>
        <th>Payload</th>
        <th>Label</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.idx }}</td>
        <td>{{ log.timestamp }}</td>
        <td>{{ log.ip }}</td>
        <td class="payload">{{ log.payload }}</td>
        <td>{{ log.label }}</td>
        <td>
          <form method="POST" action="{{ url_for('admin.block_ip') }}" style="margin:0;">
            <input type="hidden" name="ip" value="{{ log.ip }}">
            <button type="submit" class="block-btn">Block</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
